name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python tests
        run: |
          python -m pip install pytest
          python -m pytest tests -q

      - name: Node tests
        run: node --test extension/test/

      - name: Check the VSIX packs
        run: npx --yes @vscode/vsce@3.2.1 package --allow-missing-repository --skip-license --no-dependencies -o ${{ runner.temp }}/check.vsix
        working-directory: extension
